# ORCHE standard CI (copy to .github/workflows/ci.yml).
# One committed script, ./scripts/verify/ci.sh (lint -> unit tests -> type-check -> build), so CI runs
# exactly what agents run locally. CI green is never a ledger verdict on its own.
# - Docs-only changes are skipped by paths-ignore; GitHub also skips any run whose head commit
#   message contains `[skip ci]` (agents add it to docs-only commits).
# - A new push to the same ref cancels the run in progress.
# - No macos-* runners; heavy jobs go to self-hosted runners. Deploys run in the hosting pipeline,
#   not here.
# - No secrets: this workflow reads none. Never echo env or tokens into logs.
name: ci
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.orche/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # dependency cache step for the stack (setup-node cache, actions/cache, ...)
      # ci.sh runs, in order: lint -> unit tests -> type-check -> build.
      - run: ./scripts/verify/ci.sh
